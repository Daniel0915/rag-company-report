server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  ai:
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        options:
          model: qwen2.5:3b
      embedding:
        options:
          model: bge-m3
    vectorstore:
      neo4j:
        initialize-schema: true
        index-name: company-report-index
        embedding-dimension: 1024
        distance-type: cosine
        label: CompanyReportChunk
  neo4j:
    uri: ${NEO4J_URI:neo4j://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:companyreport}

dart:
  api:
    base-url: https://opendart.fss.or.kr/api
    key: ${DART_API_KEY:}

company-report:
  index-file: data/company-report-index.json

admin-document:
  registry-file: data/admin-documents.json
  upload-dir: data/admin-uploads
