server:
  port: 8080

spring:
  autoconfigure:
    exclude:
      # 기업마다 별도 벡터 인덱스/라벨을 쓰기 위해 CompanyVectorStoreRegistry가
      # 스토어를 직접 만든다 - 단일 VectorStore 빈을 만드는 자동 설정은 꺼둔다.
      - org.springframework.ai.vectorstore.neo4j.autoconfigure.Neo4jVectorStoreAutoConfiguration
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  ai:
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        options:
          model: qwen2.5:3b
      embedding:
        options:
          model: bge-m3
  neo4j:
    uri: ${NEO4J_URI:neo4j://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:companyreport}

dart:
  api:
    base-url: https://opendart.fss.or.kr/api
    key: ${DART_API_KEY:}

company-report:
  index-file: data/company-report-index.json

admin-document:
  registry-file: data/admin-documents.json
  upload-dir: data/admin-uploads
