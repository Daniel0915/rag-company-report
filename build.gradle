plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ismsp'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', '1.0.0')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-vector-store'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-neo4j'
    implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
    implementation 'org.jsoup:jsoup:1.18.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

def frontendDir = "$projectDir/frontend"
def npmCommand = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'

tasks.register('npmInstall', Exec) {
    workingDir = frontendDir
    inputs.file("$frontendDir/package.json")
    outputs.dir("$frontendDir/node_modules")
    commandLine npmCommand, 'install'
}

tasks.register('npmBuild', Exec) {
    dependsOn tasks.npmInstall
    workingDir = frontendDir
    inputs.dir("$frontendDir/src")
    inputs.file("$frontendDir/index.html")
    inputs.file("$frontendDir/vite.config.ts")
    outputs.dir("$projectDir/src/main/resources/static")
    commandLine npmCommand, 'run', 'build'
}

tasks.named('processResources') {
    dependsOn tasks.npmBuild
}

tasks.named('bootRun') {
    dependsOn tasks.npmBuild
}
